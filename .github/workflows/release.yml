name: Release

# Publish: push a tag. Every feature gets its own version (see CHANGELOG.md):
#   v0.2.3        a release (a new feature or fix bumps the patch, bigger milestones the minor)
#   v0.3.0b2      a beta build on the way to v0.3.0 (also v0.3.0-rc1); published as a pre-release
#   git tag v0.2.3 && git push origin v0.2.3
# The tag must have a "## <version>" section in CHANGELOG.md, which becomes the release notes.
# Dry run: Actions > Release > Run workflow, leave "publish" unchecked. It builds and
# packages everything and attaches the files to the run, but creates no release.
# The repository is private, so people download from the website: a published release is also sent to the website
# server (secrets VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS, optional VPS_PORT; see server/README.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag / version to build, e.g. v0.2.3 or v0.3.0b2
        required: true
        default: v0.0.0-dryrun
      publish:
        description: Publish a GitHub Release (otherwise dry run)
        type: boolean
        default: false

permissions:
  contents: write   # create the release and upload assets

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      build_args: ${{ steps.v.outputs.build_args }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+|-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' must look like v1.2.3, v1.2.3b4 or v1.2.3-rc1"; exit 1
          fi
          VERSION="${TAG#v}"
          BASE="$(echo "$VERSION" | grep -Eo '^[0-9]+\.[0-9]+\.[0-9]+')"   # platforms want plain x.y.z
          PRE=false; [[ "$VERSION" != "$BASE" ]] && PRE=true
          PUBLISH=true; [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish }}" != "true" ]] && PUBLISH=false
          if [[ "$PUBLISH" == "true" ]] && ! grep -Eq "^## \[?${VERSION//./\\.}\]?( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $VERSION' section. Add one (it becomes the release notes), commit, then re-tag."; exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            # The full version (with any b3 / -rc1) is shown in About and used by the update check.
            echo "build_args=--build-name=$BASE --build-number=${{ github.run_number }} --dart-define=APP_VERSION=$VERSION"
            echo "prerelease=$PRE"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$VERSION prerelease=$PRE publish=$PUBLISH"

  build:
    needs: meta
    uses: ./.github/workflows/build.yml
    secrets: inherit   # the Android signing key
    with:
      version: ${{ needs.meta.outputs.version }}
      build_args: ${{ needs.meta.outputs.build_args }}

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: streamboss-*
          merge-multiple: true
      - name: Checksums
        run: |
          ls -la artifacts
          cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Dry run summary
        if: needs.meta.outputs.publish != 'true'
        run: |
          echo "Dry run for ${{ needs.meta.outputs.tag }} - nothing published." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: needs.meta.outputs.publish != 'true'
        with:
          name: release-preview-${{ needs.meta.outputs.version }}
          path: artifacts/*
      - name: Create GitHub Release
        if: needs.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          VERSION="${TAG#v}"
          # Release notes = this version's CHANGELOG.md section (falls back to generated notes).
          python3 - "$VERSION" > notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          out, on = [], False
          for line in open("CHANGELOG.md", encoding="utf-8"):
              if line.startswith("## "):
                  if on:
                      break
                  on = re.match(r"## \[?" + re.escape(v) + r"\]?( |$)", line) is not None
                  continue
              if on:
                  out.append(line)
          print("".join(out).strip())
          PY
          flags=(--title "StreamBoss $TAG" --verify-tag)
          if [ -s notes.md ]; then flags+=(--notes-file notes.md); else flags+=(--generate-notes); fi
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber -R "${{ github.repository }}"
          else
            gh release create "$TAG" artifacts/* "${flags[@]}" -R "${{ github.repository }}"
          fi
      - name: Publish to the website server
        if: needs.meta.outputs.publish == 'true'
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::The website server secrets are not set (VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS), so $TAG was NOT published to the website. See server/README.md."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/deploy_key -p ${VPS_PORT:-22} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          DEST="$VPS_USER@$VPS_HOST"
          # The list as it is now. Only "not found" means a first release; any other failure stops here, so the
          # history is never replaced by an empty list.
          code="$(curl -sS -o feed.json -w '%{http_code}' --retry 3 https://streamboss.site/releases.json || true)"
          case "$code" in
            200) ;;
            404) echo '[]' > feed.json ;;
            *) echo "::error::Could not read the current releases.json (HTTP $code)"; exit 1 ;;
          esac
          python3 tool/make_manifest.py --tag "$TAG" --artifacts artifacts --notes notes.md \
            --prerelease "$PRERELEASE" --feed feed.json --out releases.json --latest-dir latest
          # Files first, the list last: nobody is pointed at a file that is not there yet.
          RS=(rsync -a --chmod=D755,F644 -e "$SSH")
          "${RS[@]}" artifacts/ "$DEST:downloads/$TAG/"
          "${RS[@]}" --delete latest/ "$DEST:downloads/latest/"
          "${RS[@]}" releases.json "$DEST:releases.json"
          echo "Published $TAG to the website server." | tee -a "$GITHUB_STEP_SUMMARY"
