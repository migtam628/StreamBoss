name: Build
on:
  push:
    branches: [main, "claude/**"]
    # Changes that touch only the server files, the website, the docs or the website upload scripts build nothing new
    # (a private repository has a monthly allowance of build minutes). Releases and pull requests always build.
    paths-ignore:
      - "server/**"
      - "site/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "tool/publish_site.sh"
      - ".github/workflows/site.yml"
      - ".github/workflows/publish-downloads.yml"
  pull_request:
  workflow_dispatch:
  # Reused by release.yml so releases ship exactly what CI builds.
  workflow_call:
    inputs:
      version:
        description: Version used in archive names (e.g. 0.1.0)
        type: string
        default: dev
      build_args:
        description: Extra flags for flutter build (e.g. --build-name=0.1.0 --build-number=12)
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --project-name streamboss --org com.streamboss --platforms=android,ios,macos,windows,linux,web
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python3 -B -m unittest discover -s tool -p 'test_*.py'   # the release list the website and the app read

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm test
        working-directory: server
      - run: docker build -t streamboss-sync server
      - name: The image starts and answers
        run: |
          docker run -d --name sync -p 8080:8080 streamboss-sync
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/api/health && exit 0; sleep 1; done
          docker logs sync
          exit 1
      - run: docker compose -f server/docker-compose.yml config -q
        env: { SYNC_DOMAIN: sync.example.com }

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux,  cmd: "flutter build linux --release" }
          - { os: ubuntu-latest,  target: web,    cmd: "flutter build web --release" }
          - { os: ubuntu-latest,  target: android, cmd: "flutter build apk --release --split-per-abi" }
          - { os: windows-latest, target: windows, cmd: "flutter build windows --release" }
          - { os: macos-latest,   target: macos,  cmd: "flutter build macos --release" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev mpv libstdc++-12-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter create . --project-name streamboss --org com.streamboss --platforms=${{ matrix.target }}
      - run: flutter pub get
      - run: dart run tool/patch_icons.dart
      - if: matrix.target == 'android'
        run: dart run tool/patch_android.dart
      - if: matrix.target == 'macos'
        run: dart run tool/patch_macos.dart
      # Optional permanent Android signing key (repository secrets, see README "Android signing").
      # Without it every CI run builds with a fresh throwaway debug key, so one release can't be
      # installed over another.
      - name: Android release signing key
        if: matrix.target == 'android'
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a throwaway debug key and cannot be installed over an earlier build. See README, Android signing."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/streamboss.jks"
          {
            echo "STREAMBOSS_KEYSTORE=$RUNNER_TEMP/streamboss.jks"
            echo "STREAMBOSS_KEYSTORE_PASSWORD=$KS_PASS"
            echo "STREAMBOSS_KEY_ALIAS=${KS_ALIAS:-streamboss}"
          } >> "$GITHUB_ENV"
      - run: ${{ matrix.cmd }} ${{ inputs.build_args }}
      # The certificate fingerprint must be identical across releases for updates to install.
      - name: Show Android signing certificate
        if: matrix.target == 'android'
        continue-on-error: true
        shell: bash
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "$(basename "$f")"; "$apksigner" verify --print-certs "$f" | grep "SHA-256"
          done
      # The sandboxed macOS app can't reach the network (client) or serve the phone-setup page
      # (server) without these entitlements.
      - name: Verify macOS network entitlements
        if: matrix.target == 'macos'
        run: |
          app="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          codesign -d --entitlements :- "$app" 2>/dev/null | tee /tmp/entitlements.txt
          grep -q "com.apple.security.network.client" /tmp/entitlements.txt
          grep -q "com.apple.security.network.server" /tmp/entitlements.txt

      # Package here (not after download-artifact): upload-artifact drops file
      # permissions, which would break the Linux/macOS executables.
      - name: Package
        if: matrix.target != 'windows'
        shell: bash
        run: |
          VER="${{ inputs.version || 'dev' }}"
          mkdir -p dist
          case "${{ matrix.target }}" in
            android)
              for f in build/app/outputs/flutter-apk/app-*-release.apk; do
                abi="$(basename "$f" -release.apk)"; abi="${abi#app-}"
                cp "$f" "dist/StreamBoss-$VER-android-$abi.apk"
              done ;;
            linux)
              bundle="$(find build/linux -type d -name bundle | head -1)"
              tar -C "$bundle" -czf "dist/StreamBoss-$VER-linux-x64.tar.gz" . ;;
            macos)
              app="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
              ditto -c -k --sequesterRsrc --keepParent "$app" "dist/StreamBoss-$VER-macos.zip" ;;
            web)
              (cd build/web && zip -qr "../../dist/StreamBoss-$VER-web.zip" .) ;;
          esac
          ls -la dist
      - name: Package (windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ver = '${{ inputs.version || 'dev' }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          $rel = Get-ChildItem build/windows -Recurse -Directory -Filter Release |
            Where-Object { Test-Path (Join-Path $_.FullName 'streamboss.exe') } | Select-Object -First 1
          if (-not $rel) { throw 'Release folder with streamboss.exe not found' }
          Compress-Archive -Path (Join-Path $rel.FullName '*') -DestinationPath "dist/StreamBoss-$ver-windows-x64.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: streamboss-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  roku:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roku
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g brighterscript brs-node
      - run: python3 ../tool/roku_lint.py .   # what the Roku's own compiler rejects but bsc lets through
      - run: bsc --project bsconfig.json --copyToStaging=false --createPackage=false
      - run: python3 ../tool/roku_i18n.py --check   # every text has es, it and pt, and Strings.brs is up to date
      - run: brs-cli components/lib/Common.brs components/lib/Strings.brs tests/common.test.brs | tee /tmp/roku-test.txt && grep -q "ALL PASSED" /tmp/roku-test.txt
      - run: brs-cli components/lib/Common.brs components/lib/Strings.brs components/lib/Sync.brs tests/sync.test.brs | tee /tmp/roku-sync-test.txt && grep -q "ALL PASSED" /tmp/roku-sync-test.txt
      - run: zip -r "../StreamBoss-${{ inputs.version || 'dev' }}-roku.zip" manifest source components images
      - uses: actions/upload-artifact@v4
        with: { name: streamboss-roku, path: StreamBoss-*-roku.zip, if-no-files-found: error }

  roku-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows }
          - { os: macos-latest,   target: macos }
          - { os: ubuntu-latest,  target: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: tool/roku_installer
      - run: dart analyze
        working-directory: tool/roku_installer
      - name: Compile the installer
        shell: bash
        working-directory: tool/roku_installer
        run: |
          mkdir -p ../../dist
          V="${{ inputs.version || 'dev' }}"
          case "${{ matrix.target }}" in
            windows)
              dart compile exe roku_installer.dart -o "../../dist/StreamBoss-$V-roku-installer-windows.exe" ;;
            macos)
              # A bare binary downloads without the executable bit and Finder will not open it, so ship a zip
              # with a double-clickable .command that opens Terminal and runs it (zip -X keeps the bits).
              dart compile exe roku_installer.dart -o roku-installer
              mkdir -p pack
              cp roku-installer pack/roku-installer
              cp "Install StreamBoss on Roku.command" pack/
              chmod +x pack/roku-installer "pack/Install StreamBoss on Roku.command"
              (cd pack && zip -X -r "../../../dist/StreamBoss-$V-roku-installer-macos.zip" .) ;;
            linux)
              dart compile exe roku_installer.dart -o roku-installer
              chmod +x roku-installer
              tar -czf "../../dist/StreamBoss-$V-roku-installer-linux.tar.gz" roku-installer ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: streamboss-roku-installer-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  tvos-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tvos
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: { swift-version: "6.0" }
      - run: python3 ../tool/tvos_i18n.py --check   # every text has es, it and pt, and the .strings files are up to date
      - run: swift test

  tvos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd tvos && xcodegen generate
      - run: cd tvos && xcodebuild -project StreamBoss.xcodeproj -scheme StreamBoss -destination 'generic/platform=tvOS Simulator' CODE_SIGNING_ALLOWED=NO build

