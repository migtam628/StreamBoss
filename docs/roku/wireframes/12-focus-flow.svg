<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C8CA1"/></marker></defs><rect width="1280" height="720" fill="#0B0B12"/><text xml:space="preserve" x="640" y="44" font-size="28" fill="#F2F2F7" font-weight="700" text-anchor="middle" >Where focus goes</text><text xml:space="preserve" x="60" y="90" font-size="14" fill="#FF3D71" font-weight="700" text-anchor="start" >START-UP</text><rect x="60" y="105" width="210" height="80" rx="8" fill="#161622" stroke="#2B2B3D" stroke-width="2"/><text xml:space="preserve" x="165.0" y="137" font-size="21" fill="#F2F2F7" font-weight="700" text-anchor="middle" >Launch</text><text xml:space="preserve" x="165.0" y="163" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >reads the saved login</text><rect x="60" y="255" width="210" height="80" rx="8" fill="#161622" stroke="#2B2B3D" stroke-width="2"/><text xml:space="preserve" x="165.0" y="287" font-size="21" fill="#F2F2F7" font-weight="700" text-anchor="middle" >Setup</text><text xml:space="preserve" x="165.0" y="313" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >type, URLs, login</text><rect x="60" y="405" width="210" height="80" rx="8" fill="#161622" stroke="#2B2B3D" stroke-width="2"/><text xml:space="preserve" x="165.0" y="437" font-size="21" fill="#F2F2F7" font-weight="700" text-anchor="middle" >Connect</text><text xml:space="preserve" x="165.0" y="463" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >loads the library</text><path d="M165,185 L165,255" fill="none" stroke="#8C8CA1" stroke-width="2" marker-end="url(#ah)"/><text xml:space="preserve" x="175" y="224" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="start" >no login saved</text><path d="M60,145 L30,145 L30,445 L60,445" fill="none" stroke="#8C8CA1" stroke-width="2" marker-end="url(#ah)"/><text xml:space="preserve" transform="translate(22,300) rotate(-90)" font-size="15" fill="#8C8CA1" text-anchor="middle">login saved</text><path d="M165,335 L165,405" fill="none" stroke="#8C8CA1" stroke-width="2" marker-end="url(#ah)"/><text xml:space="preserve" x="175" y="376" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="start" >Connect</text><path d="M270,430 L300,430 L300,295 L270,295" fill="none" stroke="#8C8CA1" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ah)"/><text xml:space="preserve" x="292" y="360" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="end" >fails</text><text xml:space="preserve" x="390" y="90" font-size="14" fill="#FF3D71" font-weight="700" text-anchor="start" >BROWSE</text><rect x="390" y="105" width="220" height="100" rx="8" fill="#1E1E34" stroke="#FF3D71" stroke-width="2"/><text xml:space="preserve" x="500.0" y="137" font-size="21" fill="#F2F2F7" font-weight="700" text-anchor="middle" >Tabs</text><text xml:space="preserve" x="500.0" y="163" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >Live  Movies  Series</text><text xml:space="preserve" x="500.0" y="183" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >My List  Search  Settings</text><rect x="700" y="105" width="220" height="100" rx="8" fill="#161622" stroke="#2B2B3D" stroke-width="2"/><text xml:space="preserve" x="810.0" y="137" font-size="21" fill="#F2F2F7" font-weight="700" text-anchor="middle" >Categories</text><text xml:space="preserve" x="810.0" y="163" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >All + the provider&#x27;s</text><text xml:space="preserve" x="810.0" y="183" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >categories (Live,</text><text xml:space="preserve" x="810.0" y="203" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >Movies, Series only)</text><rect x="1000" y="105" width="240" height="100" rx="8" fill="#161622" stroke="#2B2B3D" stroke-width="2"/><text xml:space="preserve" x="1120.0" y="137" font-size="21" fill="#F2F2F7" font-weight="700" text-anchor="middle" >Items</text><text xml:space="preserve" x="1120.0" y="163" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >channels, titles,</text><text xml:space="preserve" x="1120.0" y="183" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >episodes, results</text><path d="M610,140 L700,140" fill="none" stroke="#8C8CA1" stroke-width="2" marker-end="url(#ah)"/><text xml:space="preserve" x="655" y="128" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >Right / OK</text><path d="M700,175 L610,175" fill="none" stroke="#8C8CA1" stroke-width="2" marker-end="url(#ah)"/><text xml:space="preserve" x="655" y="196" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >Left / Back</text><path d="M920,140 L1000,140" fill="none" stroke="#8C8CA1" stroke-width="2" marker-end="url(#ah)"/><text xml:space="preserve" x="960" y="128" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >Right / OK</text><path d="M1000,175 L920,175" fill="none" stroke="#8C8CA1" stroke-width="2" marker-end="url(#ah)"/><text xml:space="preserve" x="960" y="196" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >Left / Back</text><path d="M270,455 L360,455 L360,155 L390,155" fill="none" stroke="#8C8CA1" stroke-width="2" marker-end="url(#ah)"/><text xml:space="preserve" x="352" y="420" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="end" >loaded</text><text xml:space="preserve" x="390" y="280" font-size="14" fill="#FF3D71" font-weight="700" text-anchor="start" >ACTIONS</text><rect x="1000" y="330" width="240" height="90" rx="8" fill="#141428" stroke="#2B2B3D" stroke-width="2"/><text xml:space="preserve" x="1120.0" y="362" font-size="21" fill="#F2F2F7" font-weight="700" text-anchor="middle" >Player</text><text xml:space="preserve" x="1120.0" y="388" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >full-screen video</text><rect x="700" y="330" width="240" height="90" rx="8" fill="#161622" stroke="#2B2B3D" stroke-width="2"/><text xml:space="preserve" x="820.0" y="362" font-size="21" fill="#F2F2F7" font-weight="700" text-anchor="middle" >Episodes</text><text xml:space="preserve" x="820.0" y="388" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >a series lists its episodes</text><text xml:space="preserve" x="820.0" y="408" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >(Xtream sources only)</text><rect x="390" y="330" width="240" height="90" rx="8" fill="#161622" stroke="#2B2B3D" stroke-width="2"/><text xml:space="preserve" x="510.0" y="362" font-size="21" fill="#F2F2F7" font-weight="700" text-anchor="middle" >Keyboard</text><text xml:space="preserve" x="510.0" y="388" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >Search, or a setup field</text><path d="M1120,205 L1120,330" fill="none" stroke="#8C8CA1" stroke-width="2" marker-end="url(#ah)"/><text xml:space="preserve" x="1130" y="262" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="start" >OK on a channel</text><text xml:space="preserve" x="1130" y="282" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="start" >or a movie</text><path d="M1040,205 L1040,262 L820,262 L820,330" fill="none" stroke="#8C8CA1" stroke-width="2" marker-end="url(#ah)"/><text xml:space="preserve" x="930" y="254" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >OK on a series</text><path d="M940,375 L1000,375" fill="none" stroke="#8C8CA1" stroke-width="2" marker-end="url(#ah)"/><text xml:space="preserve" x="970" y="365" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="middle" >OK</text><path d="M1160,420 L1160,470 L1060,470 L1060,205" fill="none" stroke="#8C8CA1" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ah)"/><text xml:space="preserve" x="1170" y="460" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="start" >Back</text><path d="M500,205 L500,330" fill="none" stroke="#8C8CA1" stroke-width="2" marker-end="url(#ah)"/><text xml:space="preserve" x="510" y="262" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="start" >OK on Search</text><path d="M630,400 L680,400 L680,300 L1080,300 L1080,205" fill="none" stroke="#8C8CA1" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ah)"/><text xml:space="preserve" x="690" y="292" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="start" >results fill the list</text><path d="M820,420 L820,500 L1030,500 L1030,205" fill="none" stroke="#8C8CA1" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ah)"/><text xml:space="preserve" x="830" y="515" font-size="15" fill="#8C8CA1" font-weight="400" text-anchor="start" >Back returns to the series list</text><text xml:space="preserve" x="390" y="600" font-size="16" fill="#8C8CA1" font-weight="400" text-anchor="start" >OK on a Settings row runs it (Reload library, Change source, Clear My List, Clear resume history, About).</text><text xml:space="preserve" x="390" y="626" font-size="16" fill="#8C8CA1" font-weight="400" text-anchor="start" >My List and Settings have no Categories column: Right goes from Tabs straight to Items.</text><text xml:space="preserve" x="390" y="652" font-size="16" fill="#8C8CA1" font-weight="400" text-anchor="start" >*  (Options) on an item adds or removes it from My List.   Back steps up: Items &gt; Categories &gt; Tabs.</text><text xml:space="preserve" x="390" y="678" font-size="16" fill="#8C8CA1" font-weight="400" text-anchor="start" >Up/Down zap live channels while the video is on screen.   My List holds 40 titles, resume history 80.</text></svg>