name: streamboss
description: A cross-platform IPTV player for the Xtream or M3U service you already use.
publish_to: none
version: 0.3.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.8
  xml: ^6.5.0
  package_info_plus: ^9.0.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  archive: ^4.0.0
  crypto: ^3.0.0
  cast: ^2.1.0
  bonsoir: ">=5.1.0 <6.0.0" # cast 2.1.0 does not build against bonsoir 6 and later

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icons/
